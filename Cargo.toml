[package]
name = "vortex-datafusion-vortex"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = "58.0.0"
arrow-schema = "58.0.0"
datafusion = "54.0.0"
delegate = "0.13.5"
futures = "0.3.32"
futures-util = "0.3.32"
itertools = "0.15.0"
vortex = { git = "http://github.com/vortex-data/vortex.git", branch = "develop" }
vortex-datafusion = { git = "http://github.com/vortex-data/vortex.git", branch = "develop" }

[dev-dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }

# This improved build times significantly for default common cases that we use locally
[profile.dev.package.vortex-fastlanes]
debug = false

[profile.samply]
inherits = "release"
debug = true
